<!DOCTYPE html>
<html>
<head>
    <title>Simple Counter</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 70px;
        }

        button {
            width: 80px;
            height: 80px;
            font-size: 35px;
            margin: 10px;
            cursor: pointer;
        }

        #resetBtn {
            width: 120px;
            font-size: 25px;
        }
    </style>
</head>
<body>

    <h2>APP COUNTER</h2>
    <h1 id="count">0</h1>

    <button onclick="decrease()">-</button>
    <button onclick="increase()">+</button>
    <br><br>
    <button id="resetBtn" onclick="reset()">Reset</button>

    <script>
        let count = localStorage.getItem("count");

        if (count === null) {
            count = 0;
        } else {
            count = Number(count);
        }

        document.getElementById("count").innerText = count;

        function increase() {
            count++;
            update();
        }

        function decrease() {
            count--;
            update();
        }

        function reset() {
            count = 0;
            update();
        }

        function update() {
            document.getElementById("count").innerText = count;
            localStorage.setItem("count", count);
        }
    </script>

</body>
</html>
