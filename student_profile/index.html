<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #303030;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #b5b1b1;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(246, 10, 10, 0.2);
      width: 300px;
    }
    h2 {
      text-align: center;
      color: #0a0a0a;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #0c0c0c;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #090909;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #7d8083;
    }
    .profile-card {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #e9f7ef;
      display: none;
    }
    .profile-card h3 {
      margin: 0;
      color: #2c3e50;
    }
    .profile-card p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Profile</h2>
    <input type="text" id="name" placeholder="Enter Student Name">
    <input type="text" id="roll" placeholder="Enter Roll Number">
    <input type="number" id="marks" placeholder="Enter Marks">
    <button onclick="viewProfile()">View Profile</button>

    <div class="profile-card" id="profileCard">
      <h3 id="studentName"></h3>
      <p><strong>Roll Number:</strong> <span id="studentRoll"></span></p>
      <p><strong>Marks:</strong> <span id="studentMarks"></span></p>
      <p><strong>Grade:</strong> <span id="studentGrade"></span></p>
    </div>
  </div>

  <script>
    function calculateGrade(marks) {
      if (marks >= 90) return "A+";
      else if (marks >= 75) return "A";
      else if (marks >= 60) return "B";
      else if (marks >= 45) return "C";
      else return "F";
    }

    function viewProfile() {
      const name = document.getElementById("name").value;
      const roll = document.getElementById("roll").value;
      const marks = parseInt(document.getElementById("marks").value);

      if (!name || !roll || isNaN(marks)) {
        alert("Please fill all fields correctly!");
        return;
      }

      const grade = calculateGrade(marks);

      document.getElementById("studentName").innerText = name;
      document.getElementById("studentRoll").innerText = roll;
      document.getElementById("studentMarks").innerText = marks;
      document.getElementById("studentGrade").innerText = grade;

      document.getElementById("profileCard").style.display = "block";
    }
  </script>
</body>
</html>
